<text x="48" y="51" fill="white" font-family="Arial,sans-serif" font-size="34" font-weight="700">02 • CI/CD & Deployment Flow</text><text x="50" y="82" fill="#d9ecff" font-family="Arial,sans-serif" font-size="17">Automated checks first • Deploy only after review and authorization</text><rect x="60" y="190" width="270" height="135" rx="18" fill="#ffffff" stroke="#8bb9ea" stroke-width="2"/><text x="82" y="228" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">Developer</text><text x="82" y="267" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Edit JSON input</text><text x="82" y="296" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Commit / open pull request</text><rect x="385" y="190" width="270" height="135" rx="18" fill="#f3f8ff" stroke="#8bb9ea" stroke-width="2"/><text x="407" y="228" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">GitHub repository</text><text x="407" y="267" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Terraform + schema</text><text x="407" y="296" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Tests + policy definitions</text><rect x="710" y="190" width="270" height="135" rx="18" fill="#ffffff" stroke="#8bb9ea" stroke-width="2"/><text x="732" y="228" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">GitHub Actions</text><text x="732" y="267" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Format check</text><text x="732" y="296" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Terraform validate + tests</text><rect x="1035" y="190" width="300" height="135" rx="18" fill="#f3fff9" stroke="#8bb9ea" stroke-width="2"/><text x="1057" y="228" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">Deployment</text><text x="1057" y="267" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Plan reviewed</text><text x="1057" y="296" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Apply with authorized identity</text><path d="M330 255 L385 255" stroke="#3977bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M655 255 L710 255" stroke="#3977bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M980 255 L1035 255" stroke="#3977bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="90" y="405" width="360" height="220" rx="18" fill="#ffffff" stroke="#8bb9ea" stroke-width="2"/><text x="112" y="443" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">1. Quality checks</text><text x="112" y="482" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform fmt -check</text><text x="112" y="511" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform init -backend=false</text><text x="112" y="540" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform validate</text><text x="112" y="569" fill="#29435f" font-family="Arial,sans-serif" font-size="18">JSON schema / JSON syntax</text><rect x="520" y="405" width="360" height="220" rx="18" fill="#ffffff" stroke="#8bb9ea" stroke-width="2"/><text x="542" y="443" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">2. Test & govern</text><text x="542" y="482" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform test (mock provider)</text><text x="542" y="511" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Policy JSON validation</text><text x="542" y="540" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Review resource changes</text><text x="542" y="569" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Fail fast on invalid input</text><rect x="950" y="405" width="360" height="220" rx="18" fill="#ffffff" stroke="#8bb9ea" stroke-width="2"/><text x="972" y="443" fill="#174a82" font-family="Arial,sans-serif" font-size="23" font-weight="700">3. Deploy safely</text><text x="972" y="482" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform plan -out=tfplan</text><text x="972" y="511" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Inspect plan and target subscription</text><text x="972" y="540" fill="#29435f" font-family="Arial,sans-serif" font-size="18">terraform apply tfplan</text><text x="972" y="569" fill="#29435f" font-family="Arial,sans-serif" font-size="18">Check outputs and Azure state</text><path d="M450 515 L520 515" stroke="#3977bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M880 515 L950 515" stroke="#3977bd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="45" y="790" fill="#52677e" font-family="Arial,sans-serif" font-size="15">Azure Terraform Infrastructure Platform • Central US only • JSON-driven configuration</text></svg>