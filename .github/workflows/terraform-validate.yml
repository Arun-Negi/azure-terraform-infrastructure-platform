name: Terraform validation

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "terraform.tfvars.json.example"
      - "schemas/**"
      - "docs/**"
      - "policies/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - "terraform.tfvars.json.example"
      - "policies/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Validate JSON input template and Azure Policy files
        run: |
          python -m json.tool terraform.tfvars.json.example > /dev/null
          python -m json.tool policies/azure-policy/allowed-locations.json > /dev/null
          python -m json.tool policies/azure-policy/require-managed-by-tag.json > /dev/null
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
      - name: Run Terraform configuration tests
        run: terraform test
